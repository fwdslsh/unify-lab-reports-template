<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>— Lab reports</title>
    <meta name="description" content="Lab reports and dashboard">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <include src="/_includes/header.html"></include>
    </header>
    <main id="main"><slot><h1>Lab dashboard</h1><p>Page content appears here.</p></slot></main>
    <footer class="site-footer">
      <slot name="footer"><include src="/_includes/footer.html"></include></slot>
    </footer>
    <script type="module">
      const section = location.pathname.startsWith('/articles/') ? 'articles'
        : location.pathname.startsWith('/docs/') ? 'guides'
        : location.pathname === '/sitemap.html' ? 'all'
        : location.pathname !== '/' && location.pathname !== '/index.html' && location.pathname !== '/status.html' ? 'reports' : '';
      for (const link of document.querySelectorAll('.site-nav a')) {
        const path = new URL(link.href).pathname;
        if (path === location.pathname) link.setAttribute('aria-current', 'page');
        else if (path.endsWith('/') && location.pathname.startsWith(path)) link.setAttribute('aria-current', 'location');
        else if (link.dataset.section === section) link.setAttribute('aria-current', 'location');
      }
    </script>
  </body>
</html>
