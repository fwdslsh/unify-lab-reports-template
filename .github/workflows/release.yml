name: Verify and publish

# Every push, pull request and manual run is verified: tests, the strict
# build, the audit, shell and Compose syntax, and the exact npm tarball.
# A push to main whose package.json version is not on npm yet publishes
# that tested tarball, the way fwdslsh/unify publishes its built-in
# templates: bump the version in package.json, merge, and it ships. A
# version npm already has is skipped, so a run is safe to repeat, and a
# manual run only verifies.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'fwdslsh/unify-lab-reports-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.1'
      - name: Check package identity, and skip a version npm already has
        id: version
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          private="$(node -p "require('./package.json').private === true")"
          if [ "$name" != '@fwdslsh/unify-lab-reports-template' ] || [ "$private" != 'false' ]; then
            echo '::error::Unexpected package identity or private package'; exit 1
          fi
          # `npm view` exits 0 with empty output for a missing version of an
          # existing package, so the answer is in the output, not the exit code.
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm - nothing to publish"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet"
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
          case "$version" in
            *-*) echo 'npm_tag=next' >> "$GITHUB_OUTPUT" ;;
            *) echo 'npm_tag=latest' >> "$GITHUB_OUTPUT" ;;
          esac
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun run check
      - run: bun run build
      - run: bun run audit
      - name: Check shell and Compose
        env:
          REPO_URL: https://github.com/example/my-lab-reports.git
        run: |
          bash -n scripts/deploy.sh deploy/poll.sh scripts/probes/*.sh
          docker compose config --quiet
      - name: Pack verified template
        run: |
          mkdir -p "$RUNNER_TEMP/template-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/template-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/template-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.skip == 'false' && github.repository == 'fwdslsh/unify-lab-reports-template'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: package-artifact
      - name: Publish tested tarball with trusted publishing
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          shopt -s nullglob
          archives=(package-artifact/*.tgz)
          [ "${#archives[@]}" -eq 1 ] || { echo 'Expected one tested package tarball' >&2; exit 1; }
          npm publish "./${archives[0]}" --access public --tag "$NPM_TAG" --provenance --ignore-scripts
